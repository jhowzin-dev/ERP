spring.application.name=sgmultidia-backend
server.port=8080

# PostgreSQL (docker compose: infra/docker-compose.yml)
spring.datasource.url=jdbc:postgresql://localhost:5432/sgmultidia
spring.datasource.username=sgmultidia
spring.datasource.password=sgmultidia
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Kafka (docker compose: infra/docker-compose.yml)
spring.kafka.bootstrap-servers=localhost:9092

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Observabilidade (OTel)
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Sentry (vazio = desabilitado)
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENV:dev}
