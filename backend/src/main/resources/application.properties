spring.application.name=ominicore-backend
server.port=8080

# 1. Configuração do PostgreSQL (defaults alinhados ao .env.example / docker-compose)
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:app_db}
spring.datasource.username=${POSTGRES_USER:ERP}
spring.datasource.password=${POSTGRES_PASSWORD:change_me_in_production}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neste momento o schema é criado pelo Hibernate (ddl-auto=create) e o Flyway fica
# desligado por padrão. Quando as migrations V{n}_{descricao}.sql existirem em
# classpath:db/migration, ligar via FLYWAY_ENABLED=true e JPA_DDL_AUTO=validate
# (em produção sobrescrever ambas via variáveis de ambiente).
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration

# 2. Configuração do Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=erp-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Observabilidade (OTel)
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Sentry 
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENV:dev}
