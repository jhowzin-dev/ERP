name: ingestion

on:
  push:
    paths: ["ingestion/**", "harness.ps1", "harness.sh"]
  pull_request:
    paths: ["ingestion/**"]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build ./...
        working-directory: ingestion

      - name: Test
        run: go test ./...
        working-directory: ingestion