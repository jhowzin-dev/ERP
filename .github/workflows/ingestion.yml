name: ingestion

on:
  push:
    paths: ["ingestion/**", "harness.ps1", "harness.sh"]
  pull_request:
    paths: ["ingestion/**"]

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build
        run: go build ./...
        working-directory: ingestion

      - name: Test
        run: go test ./...
        working-directory: ingestion

  # Publica a imagem multi-arch no GHCR apenas apos build+test verdes (F2 — ADR-0005).
  image:
    needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ingestion
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ominicore-ingestion:latest
            ghcr.io/${{ github.repository_owner }}/ominicore-ingestion:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max