name: frontend

on:
  push:
    paths: ["frontend/**", "harness.ps1", "harness.sh"]
  pull_request:
    paths: ["frontend/**"]

permissions:
  contents: read
  packages: write

jobs:
  lint-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  # Publica a imagem multi-arch no GHCR apenas apos lint+build verdes (F2 — ADR-0005).
  image:
    needs: lint-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ominicore-frontend:latest
            ghcr.io/${{ github.repository_owner }}/ominicore-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max