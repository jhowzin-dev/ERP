# será reescrito (Terraform + pull de imagens GHCR). Deploy legado
# (git pull + build na VPS) desativado — ver docs/sdd/adrs/ADR-0005-infra-cicd-docker-terraform.md.
# NÃO execute manualmente sem a VPS provisionada.
name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Guard: só executa no repositório oficial do owner
    if: github.repository_owner == 'jhowzin-dev'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH (docker compose)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            'cd "$HOME/ERP" && git pull --ff-only && docker compose -f backend/docker-compose.yml up -d --build'