name: Harness — QA Gate Completo

on:
  push:
    paths-ignore:
      - "docs/**"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".claude/**"

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Instalar dependências frontend
        run: npm ci
        working-directory: frontend

      - name: Executar Harness Completo
        run: bash harness.sh all
        working-directory: .

      - name: Resumo do Harness
        if: always()
        run: |
          echo "## Status do Harness" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Harness executado via \`bash harness.sh all\`" >> $GITHUB_STEP_SUMMARY