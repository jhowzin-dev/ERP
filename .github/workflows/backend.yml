name: backend

on:
  push:
    paths: ["backend/**", "harness.ps1", "harness.sh"]
  pull_request:
    paths: ["backend/**"]

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make mvnw executable
        run: chmod +x backend/mvnw

      - name: Tests
        run: ./mvnw test
        working-directory: backend


  # Publica a imagem multi-arch no GHCR apenas apos testes verdes 
  image:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ominicore-backend:latest
            ghcr.io/${{ github.repository_owner }}/ominicore-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
