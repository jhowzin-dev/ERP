name: backend

on:
  push:
    paths: ["backend/**", "harness.ps1", "harness.sh"]
  pull_request:
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sgmultidia
          POSTGRES_USER: sgmultidia
          POSTGRES_PASSWORD: sgmultidia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sgmultidia -d sgmultidia"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Tests
        run: ./mvnw test
        working-directory: backend