name: backend

on:
  push:
    paths: ["backend/**", "harness.ps1", "harness.sh"]
  pull_request:
    paths: ["backend/**"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tests
        run: ./mvnw test
        working-directory: backend